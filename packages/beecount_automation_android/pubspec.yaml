name: beecount_automation_android
description: Android notification collection and encrypted recovery queue for BeeCount automation.
version: 0.1.0-dev.1
publish_to: none

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  beecount_extension_api:
    path: ../beecount_extension_api

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.beecount.extensions.automation_android
        pluginClass: BeecountAutomationAndroidPlugin
